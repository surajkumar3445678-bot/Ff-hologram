name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZIP खोलो
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP मिली: $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          PROJ=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "प्रोजेक्ट फ़ोल्डर: $PROJ"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK बनाओ
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace

      - name: APK अपलोड करो
        uses: actions/upload-artifact@v4
        with:
          name: Xray-App-APK
          path: work/**/app/build/outputs/apk/debug/*.apk
